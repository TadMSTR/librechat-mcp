[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "librechat-mcp"
dynamic = ["version"]
description = "FastMCP server for LibreChat agent management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.20",
    # Applies LibreChat's actual rule to the User-Agent we send, rather than
    # comparing it against a constant — see tests/test_user_agent.py for why this
    # corroborates the live measurement instead of replicating it, and for the
    # negative control that makes it load-bearing.
    "ua-parser>=1.0",
]

# Read from librechat_mcp/__init__.py so the version has exactly one home.
[tool.setuptools.dynamic]
version = {attr = "librechat_mcp.__version__"}

[tool.setuptools.packages.find]
include = ["librechat_mcp*"]

[project.scripts]
librechat-mcp = "librechat_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["librechat_mcp"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]
